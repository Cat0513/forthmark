name: desktop
on:
  push:
    branches: ["windows-*"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build, install, test, uninstall
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          {
            npm ci &&
            npm test &&
            npm run dist &&
            ls -l dist/*.exe &&
            ./dist/Forthmark-Setup-*.exe //S &&
            for i in $(seq 60); do [ -f "$LOCALAPPDATA/Programs/forthmark/Forthmark.exe" ] && break; sleep 2; done &&
            sleep 5 &&
            taskkill //F //IM Forthmark.exe; # the installer starts the app; the tests start their own
            sleep 2
            node test/e2e.js "$LOCALAPPDATA/Programs/forthmark/Forthmark.exe" &&
            node test/uninstall.js "$LOCALAPPDATA/Programs/forthmark/Forthmark.exe"
          } 2>&1 | tee ../desktop.log
      - uses: actions/upload-artifact@v4
        with:
          name: Forthmark-Setup
          path: desktop/dist/Forthmark-Setup-*.exe
          if-no-files-found: ignore
      - if: failure()
        shell: bash
        run: |
          node -e "
          const t = require('fs').readFileSync('desktop.log', 'utf8').slice(-3500);
          console.log('::error::' + t.replace(/%/g, '%25').replace(/\r/g, '').replace(/\n/g, '%0A'));"
