name: test
on:
  push:
    branches: [main, "windows-*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - shell: bash
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      - if: failure()
        shell: bash
        run: |
          python -c "
          t = open('test.log', encoding='utf-8', errors='replace').read()
          t = t[t.find('=' * 70):][:3500]
          print('::error::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
      - if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          {
            python -c "import socket,time;t=time.time();print('fqdn',socket.getfqdn('127.0.0.1'),round(time.time()-t,2))"
            FORTHMARK_HOME="$RUNNER_TEMP/diag" python -c "
          import faulthandler, runpy, sys
          faulthandler.dump_traceback_later(25, exit=True)
          sys.argv = ['forthmark.py', 'serve']
          runpy.run_path('tools/forthmark.py', run_name='__main__')"
            echo "exit $?"
          } > diag.log 2>&1
          python -c "
          t = open('diag.log', encoding='utf-8', errors='replace').read()[-3500:]
          print('::error::DIAG ' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
